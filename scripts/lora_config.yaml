# LoRA training config with regularization to prevent overfitting
# For design-analyst-v4 (production quality)

# Model
model: microsoft/Phi-3-mini-4k-instruct

# Data
data: data/mlx_final
train: true
test: true
test_batches: 50

# Training schedule - conservative to prevent overfitting
batch_size: 4
iters: 600
learning_rate: 1e-5

# Sequence length
max_seq_length: 2048

# Gradient checkpointing for memory
grad_checkpoint: false

# LoRA parameters with dropout for regularization
lora_parameters:
  # Apply to attention layers
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  # Rank - moderate size
  rank: 8
  # Alpha scaling
  alpha: 16
  scale: 20.0
  # DROPOUT - key for preventing overfitting
  dropout: 0.1

# Number of layers to apply LoRA
num_layers: 16

# Checkpointing
save_every: 100
adapter_path: adapters/design-analyst-v4

# Learning rate schedule - cosine decay with warmup
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1e-7
  arguments: [1e-5, 600, 1e-7]

# Validation
val_batches: 25
steps_per_eval: 100