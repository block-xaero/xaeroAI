[package]
name = "xaeroai"
version = "0.1.0"
edition = "2024"
description = "AI runtime for Cyan - model loading, inference, LoRA swapping"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "test_pipeline"
path = "src/bin/test_pipeline.rs"

[[bin]]
name = "simple_test"
path = "src/bin/simple_test.rs"

[dependencies]
imageproc = "0.25"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.1"
tokio = { version = "1.48.0", features = ["full"] }
once_cell = "1.20"
rusqlite = { version = "0.37.0", features = ["bundled"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
blake3 = "1.5"
tracing = "0.1.43"
uuid = { version= "1.19.0", features = ["v4", "fast-rng"] }
chrono = "0.4.42"
image = "0.25"
tempfile = "3.10"
base64 = "0.22.1"
tracing-subscriber = "0.3.22"

# Platform-specific: llama.cpp for all Apple platforms
llama-cpp-2 = { version = "0.1.130", default-features = false, features = ["metal"] }

# ONNX Runtime - macOS only (no iOS binaries available)
[target.'cfg(target_os = "macos")'.dependencies]
ort = "2.0.0-rc.10"